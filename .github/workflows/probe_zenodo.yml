name: Probe real Zenodo optical dataset
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe_zenodo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download published experimental dataset
        run: |
          curl -fL --retry 2 --connect-timeout 15 --max-time 100 \
            'https://zenodo.org/records/19237616/files/Dataset.zip?download=1' \
            -o /tmp/zenodo_perovskite_2026.zip
      - name: Inspect source files and sample measurements
        run: |
          python - <<'PY'
          import zipfile,hashlib
          p='/tmp/zenodo_perovskite_2026.zip'
          with open(p,'rb') as f: data=f.read()
          print('SOURCE DOI 10.5281/zenodo.19237616; SHA256',hashlib.sha256(data).hexdigest(),'bytes',len(data))
          z=zipfile.ZipFile(p)
          for item in z.infolist():
              print('FILE',repr(item.filename),'size',item.file_size)
              if item.filename.lower().endswith(('.csv','.txt','.md')) and item.file_size < 25000:
                  print('PREVIEW',z.read(item).decode('utf-8','replace')[:1500])
          PY
      - name: Inspect tabular dimensions and labels
        run: |
          python - <<'PY'
          import zipfile,csv,io
          p='/tmp/zenodo_perovskite_2026.zip'
          with zipfile.ZipFile(p) as z:
              for filename in ['Dataset/blade_perovskite_database.csv','Dataset/curvedata_opticaldensity.csv']:
                  s=z.read(filename).decode('utf-8-sig','replace')
                  rdr=csv.DictReader(io.StringIO(s))
                  records=list(rdr)
                  print('SCHEMA',filename,'rows',len(records),'columns',len(rdr.fieldnames or []))
                  print('COLUMNS',repr(rdr.fieldnames))
                  print('FIRST_ROWS',repr(records[:2])[:14000])
                  print('LAST_ROWS',repr(records[-1:])[:5000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zenodo-2026-original-archive
          path: /tmp/zenodo_perovskite_2026.zip
          retention-days: 7
