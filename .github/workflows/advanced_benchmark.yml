name: PhotonIQ advanced real-data evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/advanced_benchmark.py'
      - 'tools/verify_advanced_results.py'
      - '.github/workflows/advanced_benchmark.yml'
permissions:
  contents: read
jobs:
  fivefold-spectral-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed scientific dependency versions
        run: |
          python -m pip install \
            numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 \
            torch==2.10.0 matplotlib==3.10.8 pytest
      - name: Download only published measured spectra
        run: |
          curl -fL --retry 2 --connect-timeout 15 --max-time 100 \
            'https://zenodo.org/records/19237616/files/Dataset.zip?download=1' \
            -o /tmp/zenodo_experimental.zip
      - name: Validate advanced benchmark code
        run: python -m pytest -q tests/test_advanced_benchmark.py
      - name: Reproduce five-fold date holdout and wavelength ablation
        run: |
          python tools/advanced_benchmark.py /tmp/zenodo_experimental.zip \
            results/zenodo_2026/advanced_cv \
            --folds 5 --epochs 150 --bootstrap 10000
      - name: Verify dates and independently recompute all reported metrics
        run: python tools/verify_advanced_results.py results/zenodo_2026/advanced_cv
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: photoniq-v2-fivefold-real-experimental-validation
          path: results/zenodo_2026/advanced_cv/
          retention-days: 90
