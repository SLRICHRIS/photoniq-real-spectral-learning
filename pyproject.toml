[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photoniq-spectral-learning"
version = "1.0.0"
description = "Leakage-safe, reproducible thickness regression on real UV-Vis spectra from experimental perovskite thin films"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PhotonIQ contributors"}]
readme = "README.md"
keywords = ["optoelectronics", "experimental spectra", "thin films", "deep learning", "perovskite"]
dependencies = [
  "numpy>=1.24,<3", "pandas>=2.0,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2",
  "torch>=2.1,<3", "openpyxl>=3.1,<4", "matplotlib>=3.7,<4", "joblib>=1.3,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "nbformat>=5.9,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
